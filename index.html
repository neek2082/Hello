<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supply Chain Tools</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-name" href="index.html">Supply Chain Tools</a>
      <button type="button" class="theme-toggle">Dark theme</button>
    </div>
  </header>

  <main class="container">
    <h1>Supply Chain Tools</h1>
    <p class="intro">
      Small, free tools that show how goods get from where they are made
      to where they are needed. Pick a tool to try it out.
    </p>

    <!-- To add a tool: copy one <li> card and point it at tools/<tool-name>.html -->
    <ul class="tool-grid">
      <li>
        <a class="tool-card" href="tools/tool-1.html">
          <h2 class="tool-card-title">Tool 1 — coming soon</h2>
          <p class="tool-card-desc">A placeholder while the first tool is being built.</p>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
